<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#002241" />
  <title>The Hub - Action Plans</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23002241'/%3E%3Cpath d='M9 16h5M9 11h9M9 21h9' stroke='%238aafd1' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Fustat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/hub-shell.css" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <!-- ================= Prototype persona banner (full-width, above the nav) ================= -->
  <div class="proto-banner" role="region" aria-label="Prototype view switcher">
    <span class="proto-tag">Prototype</span>
    <span class="proto-lead">Viewing as</span>
    <div class="proto-roles" id="protoRoles" role="group" aria-label="Role">
      <button type="button" class="proto-role on" data-role="gm" aria-pressed="true">General Manager<small>Shop level</small></button>
      <button type="button" class="proto-role" data-role="market" aria-pressed="false">Market Manager<small>Book of ~10 shops</small></button>
      <button type="button" class="proto-role" data-role="regional" aria-pressed="false">Regional Manager<small>Region of markets</small></button>
      <button type="button" class="proto-role" data-role="national" aria-pressed="false">National Manager<small>Across all regions</small></button>
    </div>
    <span class="proto-note" id="protoNote"></span>
  </div>

  <!-- ================= Navigation bar - real Hub ClientLayout shell ================= -->
  <div class="ClientLayout-module-scss-module__Skw-ja__headerWrapper">
    <div class="ClientLayout-module-scss-module__Skw-ja__navigationBarWrapper">
      <div>
        <div class="navbar-inner">
          <button class="thehub-module-scss-module__TSWhsq__button" aria-label="The Hub">
            <span class="thehub-module-scss-module__TSWhsq__logo" role="img" aria-label="The Hub"></span>
          </button>

          <nav class="nav-menu" aria-label="Primary">
      <button class="nav-item" data-label="Huddle Board"><span class="label">Huddle Board</span></button>
      <button class="nav-item" data-label="Summary"><span class="label">Summary</span></button>
      <button class="nav-item" data-label="CCC Report"><span class="label">CCC Report</span></button>
      <button class="nav-item" data-view="kpis" data-label="KPI's">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 14h3v6H4zm5-6h3v12H9zm5 3h3v9h-3zm5-7h3v16h-3z"/></svg></span>
        <span class="label">KPI's</span>
      </button>
      <button class="nav-item selected" aria-current="page" data-view="plans" data-label="Action Plans">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2m-1.06 14L7.4 13.46l1.42-1.42 2.12 2.12 4.24-4.24 1.42 1.42z"/></svg>
        </span>
        <span class="label">Action Plans</span>
      </button>
    </nav>

    <div class="nav-actions">
      <div class="shop-selector-wrap">
        <button class="shop-selector" id="shopBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Select store">
          <svg class="pin" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C7.8 2 4 5.22 4 10.2c0 3.32 2.67 7.25 8 11.8 5.33-4.55 8-8.48 8-11.8C20 5.22 16.2 2 12 2m0 10.2a2 2 0 1 1 0-4 2 2 0 0 1 0 4"/></svg>
          <span class="shop-name" id="shopName">All stores</span>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m7 10 5 5 5-5z"/></svg>
        </button>
        <div class="store-menu" id="storeMenu" role="listbox" aria-label="Stores"></div>
      </div>
      <button class="icon-btn" aria-label="Notifications">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2m6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1z"/></svg>
        <span class="badge">0</span>
      </button>
      <button class="icon-btn" aria-label="Messages">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2zm-2 0-8 5-8-5zm0 12H4V8l8 5 8-5z"/></svg>
        <span class="badge">0</span>
      </button>
      <button class="icon-btn" aria-label="User profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2M7.35 18.5C8.66 17.56 10.26 17 12 17s3.34.56 4.65 1.5C15.34 19.44 13.74 20 12 20s-3.34-.56-4.65-1.5m10.79-1.38C16.45 15.8 14.32 15 12 15s-4.45.8-6.14 2.12C4.7 15.73 4 13.95 4 12c0-4.42 3.58-8 8-8s8 3.58 8 8c0 1.95-.7 3.73-1.86 5.12M12 6c-1.93 0-3.5 1.57-3.5 3.5S10.07 13 12 13s3.5-1.57 3.5-3.5S13.93 6 12 6"/></svg>
      </button>
          </div>
        </div>
      </div>
    </div>
    <div class="ClientLayout-module-scss-module__Skw-ja__bottomOverlappingElement"></div>
  </div>

  <!-- ================= Page - real Hub content wrappers ================= -->
  <div class="ClientLayout-module-scss-module__Skw-ja__pageContentWrapper ClientLayout-module-scss-module__Skw-ja__huddleBoard">
    <div class="ClientLayout-module-scss-module__Skw-ja__pageContent ClientLayout-module-scss-module__Skw-ja__withHeader ClientLayout-module-scss-module__Skw-ja__huddleBoard">
      <div id="viewActionPlans">
      <div class="page-head">
        <div class="page-title-wrap">
          <h1 class="page-title">Action Plans</h1>
          <div class="page-sub" id="pageSub">Challenged-store remediation across the market.</div>
        </div>
        <div class="page-stats">
          <span class="stat-pill warn"><span class="n" id="statBlocked">0</span><span class="l">Blocked</span></span>
          <span class="stat-pill alert"><span class="n" id="statBehind">0</span><span class="l">Behind target</span></span>
        </div>
      </div>

      <div class="toolbar">
        <label class="field search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
          <input id="searchInput" type="search" placeholder="Search tasks, owners, stores, metrics…" aria-label="Search tasks" />
        </label>

        <label class="field select">
          <span class="visually-hidden">Filter by root cause</span>
          <select id="rootFilter" aria-label="Filter by root cause"></select>
        </label>

        <label class="field select">
          <span class="visually-hidden">Filter by owner</span>
          <select id="ownerFilter" aria-label="Filter by owner"></select>
        </label>

        <label class="field select">
          <span class="visually-hidden">Filter by owner role</span>
          <select id="roleFilter" aria-label="Filter by owner role"></select>
        </label>

        <label class="field select">
          <span class="visually-hidden">Filter by insurance carrier</span>
          <select id="carrierFilter" aria-label="Filter by insurance carrier"></select>
        </label>

        <label class="field select">
          <span class="visually-hidden">Filter by status</span>
          <select id="statusFilter" aria-label="Filter by status"></select>
        </label>

        <button class="btn btn-ghost toggle" id="behindBtn" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1 21h22L12 2zm12-3h-2v-2h2zm0-4h-2v-4h2z"/></svg>
          Behind target
        </button>

        <label class="field select">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 18h6v-2H3zM3 6v2h18V6zm0 7h12v-2H3z"/></svg>
          <select id="sortSelect" aria-label="Sort tasks">
            <option value="manual">Sort: Manual (drag)</option>
            <option value="due">Sort: Due date</option>
            <option value="priority">Sort: Priority</option>
            <option value="opened">Sort: Plan opened</option>
          </select>
        </label>

        <span class="grow"></span>

        <div class="viewtoggle" role="group" aria-label="View">
          <button type="button" class="vt-btn" data-view-mode="board" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h6v16H4zm10 0h6v16h-6z"/></svg>
            Board
          </button>
          <button type="button" class="vt-btn" data-view-mode="list" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            List
          </button>
        </div>

        <button class="btn btn-primary" id="newBtn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
          New task
        </button>
      </div>

      <div class="board" id="board" aria-label="Action plan board"></div>
      <div class="listview" id="listView" aria-label="Action plan list" hidden></div>
      </div><!-- /viewActionPlans -->

      <div id="viewKpis" hidden>
        <div id="kpiRoot" data-testid="kpi-page"></div>
      </div>
    </div>
  </div>

  <!-- ================= Task detail / edit modal ================= -->
  <div class="overlay" id="overlay" role="presentation">
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Task detail</h2>
      <div class="modal-cols">
        <form id="actionForm" class="modal-form" novalidate>
          <div class="form-grid">
            <div class="form-row full">
              <label for="fPlan">Action plan</label>
              <select id="fPlan"></select>
            </div>
            <div class="form-row full">
              <label for="fRoot">Root cause</label>
              <select id="fRoot"></select>
            </div>
            <div class="form-row full" id="carrierRow">
              <label for="fCarrier">Insurance carrier <span class="req-star" aria-hidden="true">*</span></label>
              <select id="fCarrier"></select>
              <span class="err">Select a carrier for a DRP root cause.</span>
            </div>
            <div class="form-row full">
              <label for="fTitle">Task <span aria-hidden="true">*</span></label>
              <input id="fTitle" type="text" maxlength="160" placeholder="What needs to happen?" required />
              <span class="err">Give the task a title.</span>
            </div>
            <div class="form-row full">
              <label for="fDesc">Details</label>
              <textarea id="fDesc" maxlength="600" placeholder="1–2 sentences of context…"></textarea>
            </div>
            <div class="form-row">
              <label for="fOwner">Owner</label>
              <input id="fOwner" type="text" maxlength="60" placeholder="Name" />
            </div>
            <div class="form-row">
              <label for="fRole">Role</label>
              <input id="fRole" type="text" maxlength="40" placeholder="Role" />
              <datalist id="roleOptions"></datalist>
            </div>
            <div class="form-row">
              <label for="fStatus">Status</label>
              <select id="fStatus"></select>
            </div>
            <div class="form-row">
              <label for="fPriority">Priority</label>
              <select id="fPriority"></select>
            </div>
            <div class="form-row">
              <label for="fDue">Due date</label>
              <input id="fDue" type="date" />
            </div>
            <div class="form-row">
              <label for="fMetric">Verification signal - metric</label>
              <input id="fMetric" type="text" maxlength="60" placeholder="Metric name only" />
            </div>
            <div class="form-row">
              <label for="fLag">Signal lag (days)</label>
              <input id="fLag" type="number" min="0" max="365" placeholder="e.g. 60" />
            </div>
            <div class="form-row full">
              <label for="fRisk">Risk</label>
              <input id="fRisk" type="text" maxlength="180" placeholder="What could stall this?" />
            </div>
            <div class="form-row full">
              <label for="fBlocked">Blocked reason <span class="ctx-sub">(shown when Blocked)</span></label>
              <input id="fBlocked" type="text" maxlength="180" placeholder="What it’s waiting on - carrier, capex, hiring, parts" />
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;">Delete</button>
            <div class="right">
              <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
              <button type="submit" class="btn btn-primary" id="saveBtn">Save task</button>
            </div>
          </div>
        </form>
        <aside class="modal-context">
          <div id="logWrap" class="ctx"></div>
        </aside>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/config.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
